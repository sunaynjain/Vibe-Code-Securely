services:
  vibe-coded-security-lab:
    build:
      context: ./projects/vibe-coded-security-lab
      dockerfile: Dockerfile
    container_name: cybersanket-vibe-security-lab
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
